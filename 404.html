<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#30251F">
  <title>Página no encontrada | Jorge Loreto</title>
  <style>
    :root{color-scheme:light;--cream:#F6F0E7;--brown:#30251F;--terracotta:#B45F43;--muted:#665950}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--cream);color:var(--brown);font:16px/1.7 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(620px,90%);padding:clamp(28px,7vw,64px);border:1px solid rgba(48,37,31,.14);border-radius:24px;background:#fffaf3}
    .eyebrow{color:var(--terracotta);font-size:.78rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase}
    h1{margin:.2em 0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.5rem,9vw,4.5rem);line-height:1}
    p{color:var(--muted)}a{display:inline-block;margin-top:12px;padding:12px 18px;border-radius:999px;background:var(--brown);color:#fffaf3;text-decoration:none;font-weight:700}
    a:focus-visible{outline:3px solid var(--terracotta);outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Jorge Loreto · Portafolio</p>
    <h1>Esta página no existe.</h1>
    <p>Es posible que el enlace haya cambiado. Vuelve al portafolio para encontrar el proyecto que buscas.</p>
    <a href="/">Volver al portafolio</a>
  </main>
</body>
</html>
